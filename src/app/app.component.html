<div class="container">
  <header>
    <h1><i class="fas fa-tasks"></i> Task Manager</h1>
    <p>Powered by Angular & RxJS</p>
    <!-- <button class="theme-toggle" (click)="toggleDarkMode()">
      <i [class.fas]="isDarkMode" [class.far]="!isDarkMode" class="fa-moon"></i>
    </button> -->
  </header>

  <!-- Add Task -->
  <div class="input-card">
    <div class="input-group">
      <input
        type="text"
        [formControl]="searchControl"
        placeholder="Add or search tasks..."
        (keyup.enter)="addTask(searchControl.value ?? '')"
      />
      <button (click)="addTask(searchControl.value ?? '')">
        <i class="fas fa-plus"></i> Add
      </button>
    </div>
  </div>

  <!-- Task Tabs -->
  <div class="tabs">
    <div class="tab-header">
      <button [class.active]="activeTab === 'all'" (click)="activeTab = 'all'">All Tasks</button>
      <button [class.active]="activeTab === 'active'" (click)="activeTab = 'active'">Active</button>
      <button [class.active]="activeTab === 'completed'" (click)="activeTab = 'completed'">Completed</button>
      <button [class.active]="activeTab === 'search'" (click)="activeTab = 'search'">Search</button>
    </div>

    <div class="tab-content" *ngIf="activeTab === 'all'">
      <div class="task-card" *ngFor="let task of allTasks$ | async; trackBy: trackById">
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleTask(task.id)"
        />
        <span [class.completed]="task.completed">{{ task.title }}</span>
        <button class="delete-btn" (click)="deleteTask(task.id)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="tab-content" *ngIf="activeTab === 'active'">
      <div class="task-card" *ngFor="let task of activeTasks$ | async; trackBy: trackById">
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleTask(task.id)"
        />
        <span [class.completed]="task.completed">{{ task.title }}</span>
        <button class="delete-btn" (click)="deleteTask(task.id)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="tab-content" *ngIf="activeTab === 'completed'">
      <div class="task-card" *ngFor="let task of completedTasks$ | async; trackBy: trackById">
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleTask(task.id)"
        />
        <span [class.completed]="task.completed">{{ task.title }}</span>
        <button class="delete-btn" (click)="deleteTask(task.id)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="tab-content" *ngIf="activeTab === 'search'">
      <div class="task-card" *ngFor="let task of filteredTasks$ | async; trackBy: trackById">
        <input
          type="checkbox"
          [checked]="task.completed"
          (change)="toggleTask(task.id)"
        />
        <span [class.completed]="task.completed">{{ task.title }}</span>
        <button class="delete-btn" (click)="deleteTask(task.id)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
  </div>
</div>
